version: "3.9"

services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: qa101
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-dotnet-api
    depends_on:
      - postgres
    ports:
      - "5087:5087"
      - "5088:5088"
      - "5089:5089"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
